# dgnb_rom — the boss-battle spike's art, as ROM data (docs/dungeons/18).
#
# Converted by tools/gen_dgn_boss_assets.py from COMMITTED indexed strips; the build never runs
# Blender. A GLOBAL blob feature for the reason sprg_rom states (ROM data is game-lifetime and ca65
# resolves scopes backward). Each claim site in game/dgn_boss/main.asm .asserts the blob's linker
# bank/addr against the emitted symbols.
#
# THE BOSS IS TWO CLAIMS, NOT ONE, because a LoROM bank is 32 KB and a frame must not cross a bank
# (DMA cannot): 14 frames x 2,048 B = 28,672 B a facing, one bank each. The ROM walks
# (bank, addr + frame x 2048); no frame straddles.
name = "dgnb_rom"
role = "blob"

[[claims.rom]]
name = "dgnb_boss_down_rom"
bytes = 28672            # 14 frames x 8x8 tiles x 32 B (a 64x64 boss frame is up to 64 tiles)

[[claims.rom]]
name = "dgnb_boss_right_rom"
bytes = 28672

[[claims.rom]]
name = "dgnb_hero_rom"
bytes = 4608             # 1 facing (right; left is its HFLIP) x 9 frames x 512 B (a 4x4-tile player slot image)

[[claims.rom]]
name = "dgnb_res_rom"
bytes = 3072             # 96 tiles: both enemies, resident in OBJ name table 1

[[claims.rom]]
name = "dgnb_pal_rom"
bytes = 128              # OBJ palettes 0 P1, 1 P2, 2 boss, 3 enemies
