# dgnh_obj — the model spike's on-hardware proof: the wanderer's committed
# frames as 16x16 OBJs, animated on actions.toml's holds.
#
# NINE ACTORS: walk right / left (HFLIP of right, docs/dungeons/11 §2) / up /
# down in P1; idle in the same four facings in P2; and one P1 walker crossing
# the screen at the walk's ground speed, so foot slide is visible. All frames
# are RESIDENT (18 frames, 72 tiles): the spike does not stream. obj_stream is
# M3's (docs/dungeons/02 §1.2).
#
# CPU-WRITTEN REGISTER, DECLARED: OBSEL $2101 (sprite size + OBJ CHR base for
# every sprite), as every rail's OBJ feature does: oam_sprites is the OAM
# transport, not the size/base authority.
name = "dgnh_obj"
role = "consumer"
depends = ["oam_sprites", "dgnh_rom"]

# The enter-time CHR upload, forced blank by the scene_mgr enter contract.
[[claims.dma_init]]
name = "obj_up"
channel = 0
registers = ["VMDATAL", "VMDATAH"]
mode = 1

[[claims.vram]]
name = "obj_chr"
kind = "chr"
obj = true
words = 1536             # 96 tiles x 16 words: the whole blob, one DMA

[[claims.cgram]]
name = "obj_pal"
words = 32
at = 128                 # hardware: OBJ palettes start at CGRAM 128.
                         # 128..143 = palette 0 (P1), 144..159 = palette 1 (P2)

# Pinned: slot order is sprite priority, and a test reads entries by index.
# TWELVE slots for nine actors so the three hi-table bytes are wholly ours
# (sprg_obj's argument): slots 9..11 are parked.
[[claims.oam]]
name = "actors"
sprites = 12
at = 0

[[claims.reg]]
name = "obj_obsel"
registers = ["OBSEL"]
