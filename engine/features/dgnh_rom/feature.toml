# dgnh_rom — the model spike's wanderer, as ROM data: every idle + walk frame
# (16x32) in all three rendered directions, and the P1 / P2 hero palettes.
#
# Converted by tools/gen_dgn_hero_assets.py from the COMMITTED indexed strips
# (art/dungeons/actors/frames/): the build never runs Blender. Each claim site
# in game/dgn_hero/main.asm .asserts the blob's linker bank/addr against the
# emitted symbols, so allocator<->linker drift refuses the build.
#
# GLOBAL blob feature, for the reason sprg_rom states: ROM data is
# game-lifetime and ca65 resolves scopes backward.
name = "dgnh_rom"
role = "blob"

[[claims.rom]]
name = "dgnh_obj_chr_rom"
bytes = 6144             # 192 OBJ tiles x 32 B 4bpp: 18 16x32 frames laid out in the
                         # 16-wide OBJ name table (3 bands of 8 frames, 4 tile rows each)

[[claims.rom]]
name = "dgnh_obj_pal_rom"
bytes = 64               # 32 BGR555 words: OBJ palette 0 = P1 (dusk blue),
                         # OBJ palette 1 = P2 (amber). Same indices, so the
                         # roles.toml contract is one palette swap
