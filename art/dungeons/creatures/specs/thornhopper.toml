# thornhopper — tree frog + praying mantis + carnivorous flower (owner brief: docs/dungeons/refs/).
# A plump emerald body, enormous folded mantis hind legs, a crimson flower-bud head with one yellow
# eye. Still, then a short springy HOP; legs compress hard before every jump. Attack: crouch, bloom,
# LEAP at the player, land with a bounce. Spring-loaded: squash and stretch carry the personality.
name = "thornhopper"
family = "thornhopper"
size_class = "obj32"
shadow = [0.2, 0.15]

[camera]
depression_deg = 35.0
px_per_unit = 46
supersample = 8
margin_px = 4
box = [32, 32]
anchor = [17, 24.0]
yaw_deg = { right = 90.0, up = 180.0, down = 0.0 }

[light]
samples = 2
sun_dir = [-0.50, 0.50, -0.60]

[default.keys]
"flower.stretch" = 1.5            # a closed bud unless an action opens it

[[bone]]
name = "root"
parent = ""
head = [0, 0, 0]
tail = [0, 0, 0.1]
[[bone]]
name = "body"
parent = "root"
head = [0, 0.04, 0.14]
tail = [0, -0.1, 0.14]
[[bone]]
name = "shape"                    # SQUASH and STRETCH act on this bone: it carries the body meshes
parent = "body"
head = [0, 0, 0.12]
tail = [0, 0, 0.22]
[[bone]]
name = "flower"                   # STRETCH < 1 opens the bloom flat; > 1 closes it into a tall bud
parent = "shape"
head = [0, -0.13, 0.22]
tail = [0, -0.13, 0.32]

[[part]]
kind = "ellipsoid"
name = "body"
c = [0, 0.03, 0.17]
r = [0.15, 0.19, 0.11]
role = "skin"
bone = "shape"
[[part]]
kind = "ellipsoid"
name = "belly"
c = [0, -0.01, 0.125]
r = [0.115, 0.15, 0.06]
role = "belly"
bone = "shape"
[[part]]
kind = "limb"
name = "stem"
a = [0, -0.10, 0.19]
b = [0, -0.13, 0.26]
radius = 0.04
role = "skin"
bone = "flower"
[[part]]
kind = "petals"
name = "petal"
c = [0, -0.13, 0.275]
n = 6
r = [0.075, 0.036, 0.014]
radius = 0.05
tilt = 38
role = "petal"
bone = "flower"
[[part]]
kind = "ellipsoid"
name = "eyeball"
c = [0, -0.13, 0.29]
r = [0.05, 0.05, 0.038]
role = "eyeball"
bone = "flower"
[[part]]
kind = "ellipsoid"
name = "pupil"
c = [0, -0.13, 0.312]
r = [0.022, 0.022, 0.016]
role = "pupil"
bone = "flower"

# the small frog arms
[[legset]]
name = "fore"
parent = "body"
tags = ["L", "R"]
radius = [0.03, 0.024]
role = "leg"
knee_lift = 0.04
knee_out = 0.04
pole_up = 0.2
pole_out = 0.1
[legset.claws]
n = 3
spread = 0.03
len = 0.04
radius = 0.014
role = "belly"
[legset.hip]
L = [0.10, -0.10, 0.13]
R = [-0.10, -0.10, 0.13]
[legset.foot]
L = [0.17, -0.20, 0.0]
R = [-0.17, -0.20, 0.0]

# the enormous folded mantis hind legs: the knee rides high and BACK, the shin folds forward
[[legset]]
name = "hind"
parent = "body"
tags = ["L", "R"]
radius = [0.04, 0.028]
role = "leg"
knee_vec = [0.06, 0.14, 0.28]
pole_up = 0.4
pole_out = 0.15
[legset.pad]
r = [0.04, 0.07, 0.025]
role = "leg"
[legset.hip]
L = [0.125, 0.09, 0.17]
R = [-0.125, 0.09, 0.17]
[legset.foot]
L = [0.15, 0.04, 0.0]
R = [-0.15, 0.04, 0.0]

# ---- actions -----------------------------------------------------------------------------------------------------
[action.idle]
type = "keys"
frames = 3
hold = [26, 10, 26]
[action.idle.keys]
"body.z" = [0.0, -0.006, 0.0]
"shape.stretch" = [1.0, 0.95, 1.0]

# HOP: crouch, spring up with the hind legs thrown back, hang at the apex, land with a squash
[action.hop]
type = "poses"
frames = 4
hold = [7, 5, 5, 8]
[action.hop.keys]
"body.z" = [-0.03, 0.08, 0.105, -0.035]
"body.y" = [0.0, -0.015, -0.025, -0.01]
"shape.stretch" = [0.85, 1.25, 1.1, 0.82]
"body.pitch" = [0.0, -8.0, 4.0, 0.0]
[action.hop.feet]
"hind.L" = ["home", { home = [0.0, 0.12, 0.16] }, { home = [0.0, 0.14, 0.2] }, "home"]
"hind.R" = ["home", { home = [0.0, 0.12, 0.16] }, { home = [0.0, 0.14, 0.2] }, "home"]
"fore.L" = ["home", { home = [0.0, -0.05, 0.12] }, { home = [0.0, -0.06, 0.1] }, "home"]
"fore.R" = ["home", { home = [0.0, -0.05, 0.12] }, { home = [0.0, -0.06, 0.1] }, "home"]

# PREPARE: crouch low and stay there, the legs compressing, the petals OPENING
[action.prepare]
type = "poses"
frames = 3
hold = [10, 10, 12]
[action.prepare.keys]
"body.z" = [-0.04, -0.07, -0.08]
"body.pitch" = [0.0, 6.0, 9.0]
"shape.stretch" = [0.88, 0.72, 0.66]
"flower.stretch" = [1.2, 0.8, 0.55]
[action.prepare.feet]
"hind.L" = ["home", "plant", "plant"]
"hind.R" = ["home", "plant", "plant"]
"fore.L" = ["home", "plant", "plant"]
"fore.R" = ["home", "plant", "plant"]

# ATTACK: launch, hang over the player with the bloom wide open, land with a bounce
[action.attack]
type = "poses"
frames = 3
hold = [4, 6, 9]
anchor = [12, 20.0]
[action.attack.keys]
"body.z" = [0.05, 0.11, -0.04]
"body.y" = [-0.05, -0.12, -0.15]
"shape.stretch" = [1.4, 1.15, 0.76]
"body.pitch" = [-10.0, 10.0, 0.0]
"flower.stretch" = [0.6, 0.5, 0.7]
[action.attack.feet]
"hind.L" = [{ home = [0.0, 0.14, 0.18] }, { home = [0.0, 0.1, 0.3] }, { home = [0.0, -0.13, 0.0] }]
"hind.R" = [{ home = [0.0, 0.14, 0.18] }, { home = [0.0, 0.1, 0.3] }, { home = [0.0, -0.13, 0.0] }]
"fore.L" = [{ home = [0.0, -0.1, 0.16] }, { home = [0.0, -0.14, 0.2] }, { home = [0.0, -0.15, 0.0] }]
"fore.R" = [{ home = [0.0, -0.1, 0.16] }, { home = [0.0, -0.14, 0.2] }, { home = [0.0, -0.15, 0.0] }]

[paint]
cover = 0.42
smooth = 0.6
cluster_passes = 3
rim = 1
contact = true
lit_soft = true
shadow = "dither"
no_rim = ["eyeball", "pupil", "belly", "detail"]
no_outline = ["leg"]
over = ["belly", "skin", "leg", "detail", "eyeball", "pupil", "petal"]

[palette]
# emerald skin (4) + olive legs (2) + a crimson bloom (3) + one yellow eye
base = ["#123a22", "#1f6a36", "#38a44c", "#84d468",
        "#3a5a1c", "#82aa34",
        "#7a1220", "#d02a3a", "#f47a78",
        "#ffd030", "#1a0808", "#c8dc94", "#0a1a0e", "#284a2c", "#06100a"]
