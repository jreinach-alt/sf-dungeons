# crownling_boss — the GIANT Crownling, built to be a MODE 7 plane (docs/dungeons/20).
# Rendered looking straight DOWN (depression 90), so rotating the image about its centre is the crown spinning
# on its own vertical axis. One still pose; the plane is rotated, scaled and slid by the PPU's matrix.
# A flat rosette: an ivory shell with five uneven radial points, a violet eye in the middle, four tendrils
# between the points, and one long violet BLADE (the brief's beam) along -Y, the image's "forward" (down).
# 256 unique 8x8 tiles is the whole budget (Mode 7 has one 128x128 map and 256 tiles of 8bpp CHR), so the
# crown is 128 px across at 1x: the matrix magnifies it 2x to fill the top of the screen. The blade runs 120 px
# (240 on screen) from the eye, so a slice reaches the players at the bottom.
name = "crownling_boss"
family = "crownling"
size_class = "bg"
shadow = [0.001, 0.001]

[camera]
depression_deg = 90.0
px_per_unit = 100
supersample = 6
margin_px = 4
box = [128, 192]
anchor = [64, 64]
yaw_deg = { right = 90.0, up = 180.0, down = 0.0 }

[light]
samples = 2
sun_dir = [-0.35, 0.45, -0.82]

[default.keys]

[[bone]]
name = "root"
parent = ""
head = [0, 0, 0]
tail = [0, 0, 0.1]
[[bone]]
name = "body"
parent = "root"
head = [0, 0, 0.2]
tail = [0, -0.1, 0.2]


[[part]]
kind = "lathe"
name = "shell"
c = [0, 0, 0.0]
pts = [[0.46, 0.20], [0.45, 0.25], [0.40, 0.28], [0.30, 0.25], [0.22, 0.20]]
roles = ["crown", "crack", "crown", "crown"]
role = "crown"
bone = "body"
nu = 40

[[part]]
kind = "cone"
name = "point0"
a = [0.376, 0.137, 0.23]
b = [0.573, 0.209, 0.23]
radius = 0.075
role = "crown"
bone = "body"
seg = 8

[[part]]
kind = "cone"
