[action.idle]
type = "keys"
frames = 1
hold = [60]
[action.idle.keys]
"body.z" = [0.0]

[paint]
cover = 0.42
smooth = 0.6
cluster_passes = 3
rim = 1
contact = true
lit_soft = true
shadow = false
no_rim = ["crack", "pupil", "beam", "detail"]
over = ["detail", "tendril", "eye", "pupil", "crack", "crown", "beam"]

[palette]
base = ["#5e504c", "#a09088", "#d8cabc", "#f8f0e0",
