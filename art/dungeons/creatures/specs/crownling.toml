# crownling — stag beetle + jellyfish + broken porcelain crown (owner brief: docs/dungeons/refs/).
# A floating ivory crown-shell with five uneven cracked points over one oversized violet eye hung
# between four thick tendrils. Weightless: a hover-bob, tendrils undulating in a travelling wave.
# Attack: stop drifting, RETRACT the tendrils (the telegraph), charge the eye (the pupil swells), then
# fire a narrow violet beam. The tendril chains are FK; their waves come from the `wave` generator.
