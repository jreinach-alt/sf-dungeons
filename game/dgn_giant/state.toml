# dgn_giant state. All scene-scoped @dp words; written in enter before any read (rule 5).

[scene.giant]
t = "u16@dp"            # the tick of the loop whose record is in the OAM shadow
                        # TICK: ok — an index into a pre-baked score, one record per game frame by construction
rec = "u16@dp"          # byte offset of that record in the score (t * 33, kept as a running sum)
ct = "u16@dp"           # the tick whose DMA rows the NMI plays
                        # TICK: ok — the score index, as t
c_cur = "u16@dp"        # command stream cursor (byte offset)
c_end = "u16@dp"        # one past the last command to play
c_src = "u16@dp"        # a command's source offset within the players' blob
vend = "u16@dp"         # the V counter at the END of the NMI hook (how far into VBlank the work got)
vmax = "u16@dp"         # its running maximum
s77 = "u16@dp"          # STAT77 bits 6-7 (time over / range over), OR-ed over every frame so far
                        # TICK: ok — a latched hardware flag, no time unit
